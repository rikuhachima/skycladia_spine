<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spine Viewer</title>
    <!-- Dipin PERSIS ke 4.1.23, sesuai versi asli file .skel -->
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.1.23/dist/iife/spine-player.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.1.23/dist/spine-player.min.css">
    <style>
        body { margin: 0; background: #222; font-family: sans-serif; }
        #player { width: 100vw; height: 100vh; }
        #status {
            position: absolute; top: 70px; left: 20px; z-index: 10;
            color: #fff; background: rgba(0,0,0,0.6);
            padding: 8px 12px; font-size: 12px; font-family: monospace;
            max-width: 90vw; white-space: pre-wrap; max-height: 60vh; overflow-y: auto;
        }
        #controls {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            display: flex; gap: 8px; align-items: center;
        }
        #controls button, #controls input {
            padding: 8px 12px; font-size: 14px; border-radius: 6px; border: 1px solid #888;
            background: #333; color: #fff;
        }
    </style>
</head>
<body>
<div id="player"></div>

<div id="controls">
    <button onclick="recordSpine()">Record</button>
    <input type="number" id="durationInput" value="3" min="1" max="15" style="width:50px" title="Durasi (detik)">
    <span style="color:#fff">detik</span>
</div>

<div id="status"></div>

<script>
// ============================================================
// KONFIGURASI — sesuaikan dengan nama file di repo kamu
// ============================================================
const ASSET_NAME = "1505";          // dipakai untuk .skel (selalu tanpa HD)
const USE_HD = true;                // true = 1505HD.atlas/.webp, false = 1505.atlas/.webp
const ATLAS_BASE = USE_HD ? ASSET_NAME + "HD" : ASSET_NAME;
const SKEL_PATH = ASSET_NAME + ".skel";
const ATLAS_PATH = ATLAS_BASE + ".atlas";

// ============================================================
// fix-webm-duration disematkan langsung (dari yusitnikov/fix-webm-duration, diringkas)
// ============================================================
function ysFixWebmDuration(blob, duration, callback) {
    var reader = new FileReader();
    reader.onload = function() {
        var buffer = new Uint8Array(reader.result);
        var fixed = fixWebmBuffer(buffer, duration);
        var fixedBlob = new Blob([fixed], { type: blob.type });
        callback(fixedBlob);
    };
    reader.readAsArrayBuffer(blob);
}
function fixWebmBuffer(buffer, duration) {
    var doubleToString = function(num) {
        var buf = new ArrayBuffer(8);
        new DataView(buf).setFloat64(0, num);
        return Array.from(new Uint8Array(buf)).map(b => String.fromCharCode(b)).join('');
    };
    var bufferStr = Array.from(buffer).map(b => String.fromCharCode(b)).join('');
    var durationIndex = bufferStr.indexOf('\x44\x89');
    if (durationIndex < 0) return buffer;
    var durationStr = doubleToString(duration);
    var out = new Uint8Array(buffer);
    var writeAt = durationIndex + 3;
    for (var i = 0; i < 8; i++) out[writeAt + i] = durationStr.charCodeAt(i);
    return out;
}

const statusEl = document.getElementById("status");
function log(msg) { statusEl.textContent += msg + "\n"; console.log(msg); }

// ============================================================
// KONVERTER ATLAS KUSTOM → FORMAT STANDAR SPINE
// File .atlas kamu pakai "bounds:" / "offsets:" (bukan xy/size/orig/offset
// standar), jadi diterjemahkan dulu sebelum diserahkan ke SpinePlayer.
// ============================================================
function convertCustomAtlas(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    let i = 0;
    const pageName = lines[i++];
    const size = lines[i++].split(":")[1].split(",").map(s => s.trim());
    const filter = lines[i++].split(":")[1].split(",").map(s => s.trim());
    if (lines[i] && lines[i].toLowerCase().startsWith("scale:")) i++;

    let out = pageName + "\n";
    out += "size: " + size[0] + "," + size[1] + "\n";
    out += "format: RGBA8888\n";
    out += "filter: " + filter[0] + "," + filter[1] + "\n";
    out += "repeat: none\n";

    let count = 0;
    while (i < lines.length) {
        const name = lines[i++];
        if (!lines[i] || !lines[i].toLowerCase().startsWith("bounds:")) continue;
        const b = lines[i++].split(":")[1].split(",").map(Number);
        const o = lines[i] && lines[i].toLowerCase().startsWith("offsets:")
            ? lines[i++].split(":")[1].split(",").map(Number)
            : [0, 0, b[2], b[3]];
        let rotate = false;
        if (lines[i] && lines[i].toLowerCase().startsWith("rotate:")) { rotate = true; i++; }

        out += name + "\n";
        out += "  rotate: " + rotate + "\n";
        out += "  xy: " + b[0] + ", " + b[1] + "\n";
        out += "  size: " + b[2] + ", " + b[3] + "\n";
        out += "  orig: " + o[2] + ", " + o[3] + "\n";
        out += "  offset: " + o[0] + ", " + o[1] + "\n";
        out += "  index: -1\n";
        count++;
    }
    log("Atlas dikonversi: " + count + " region ditemukan.");
    return out;
}

function textToDataURI(text, mime) {
    // encode UTF-8 aman (nama region bisa berisi karakter Mandarin)
    const bytes = new TextEncoder().encode(text);
    let binary = "";
    bytes.forEach(b => binary += String.fromCharCode(b));
    return "data:" + mime + ";base64," + btoa(binary);
}

// ============================================================
// AMBIL & KONVERSI ATLAS DULU, BARU BUAT SPINEPLAYER
// ============================================================
log("Mengunduh " + ATLAS_PATH + "...");

fetch(ATLAS_PATH, { cache: "no-store" })
    .then(r => {
        if (!r.ok) throw new Error(ATLAS_PATH + " → HTTP " + r.status);
        return r.text();
    })
    .then(rawAtlasText => {
        const convertedAtlas = convertCustomAtlas(rawAtlasText);
        const atlasDataURI = textToDataURI(convertedAtlas, "application/octet-stream");

        log("Membuat SpinePlayer (skel: " + SKEL_PATH + ", atlas: " + ATLAS_PATH + ")...");

        const player = new spine.SpinePlayer("player", {
            binaryUrl: SKEL_PATH,
            atlasUrl: ATLAS_PATH,
            rawDataURIs: {
                [ATLAS_PATH]: atlasDataURI   // timpa isi .atlas dengan versi yang sudah dikonversi
                // catatan: file .webp TIDAK ditimpa di sini — biarkan SpinePlayer fetch normal
                // dari folder yang sama dengan ATLAS_PATH (nama file webp harus PERSIS sama
                // dengan nama page di baris pertama file .atlas, mis. "1505HD.webp")
            },
            showControls: true,
            alpha: true,
            backgroundColor: "00000000",
            premultipliedAlpha: false,
            preserveDrawingBuffer: true,
            success: function(player) {
                log("Spine dimuat. Animasi tersedia: " + player.skeleton.data.animations.map(a => a.name).join(", "));
                const canvas = player.dom.querySelector("canvas");
                canvas.addEventListener("webglcontextlost", () => {
                    log("PERINGATAN: WebGL context hilang (beban terlalu berat).");
                });

                window.recordSpine = function() {
                    statusEl.textContent = "";
                    const durationSec = parseFloat(document.getElementById("durationInput").value) || 3;
                    log("Merekam " + durationSec + " detik...");

                    let rect = canvas.getBoundingClientRect();
                    let recordCanvas = document.createElement("canvas");
                    let maxSide = 2048;
                    let scale = maxSide / Math.max(rect.width, rect.height);
                    recordCanvas.width = Math.round(rect.width * scale);
                    recordCanvas.height = Math.round(rect.height * scale);
                    let rctx = recordCanvas.getContext("2d");
                    rctx.imageSmoothingEnabled = true;
                    rctx.imageSmoothingQuality = "high";

                    let drawInterval = setInterval(() => {
                        rctx.clearRect(0, 0, recordCanvas.width, recordCanvas.height);
                        rctx.drawImage(canvas, 0, 0, recordCanvas.width, recordCanvas.height);
                    }, 1000 / 24);

                    let stream = recordCanvas.captureStream(24);
                    let recorder = new MediaRecorder(stream, {
                        mimeType: "video/webm;codecs=vp8",
                        videoBitsPerSecond: 12000000
                    });
                    let chunks = [];
                    let startTime = Date.now();

                    recorder.ondataavailable = e => {
                        if (e.data.size > 0) {
                            chunks.push(e.data);
                            log("chunk " + chunks.length + ": +" + (e.data.size / 1024).toFixed(1) + " KB");
                        }
                    };

                    recorder.onstop = () => {
                        clearInterval(drawInterval);
                        let duration = Date.now() - startTime;
                        let buggyBlob = new Blob(chunks, { type: "video/webm" });
                        log("Ukuran video: " + (buggyBlob.size / 1024 / 1024).toFixed(2) + " MB");

                        ysFixWebmDuration(buggyBlob, duration, function(fixedBlob) {
                            log("Selesai, ukuran akhir: " + (fixedBlob.size / 1024 / 1024).toFixed(2) + " MB");
                            let url = URL.createObjectURL(fixedBlob);
                            let a = document.createElement("a");
                            a.href = url;
                            a.download = ATLAS_BASE + "-animation.webm";
                            a.click();
                            log("Download dimulai.");
                        });
                    };

                    recorder.start(1000);
                    setTimeout(() => recorder.stop(), durationSec * 1000);
                };
            },
            error: function(player, error) {
                log("ERROR SPINE: " + error);
            }
        });
    })
    .catch(e => {
        log("GAGAL: " + (e.message || e));
        console.error(e);
    });
</script>
</body>
</html>
